# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '41d0fb42-9359-4cea-8d69-acf1a60a60b5'
  imageRepository: 'namsethpipelinesjavascriptdocker'
  containerRegistry: 'tight.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/app/Dockerfile'
  tag: '$(Build.BuildNumber)'
  appServiceName: 'doshowsome'
  resourceGroup: 'naman'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2

      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
      
- stage: Deploy
  displayName: Deploy to app service
  jobs:
  - job: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    steps:  
      - task: AzureCLI@2
        inputs:
          azureSubscription: 'namanserviceconnection'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            echo "Restarting Azure App Service....."
            az webapp restart --name $(appServiceName) --resource-group $(resourceGroup)

