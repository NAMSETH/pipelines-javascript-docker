trigger: none # Disables automatic execution on code commits

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Image repositories and registries
  imageRepository: 'namsethpipelinesjavascriptdocker'
  sourceRegistry: 'tight.azurecr.io'
  targetRegistry: 'nonprodacr.azurecr.io'
  imageTag: 'latest'

steps:
# Do not check out code since we are only manipulating an existing image
- checkout: none

# Single task that handles login, pull, tag, and push using Azure platform credentials
- task: AzureCLI@2
  displayName: 'Authenticate, Pull, Tag, and Push Image'
  inputs:
    # Use any valid Azure Subscription service connection you have in DevOps
    azureSubscription: 'Your-Azure-Subscription-Service-Connection' 
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Logging into source registry: $(sourceRegistry)..."
      az acr login --name tight
      
      echo "Pulling image..."
      docker pull $(sourceRegistry)/$(imageRepository):$(imageTag)
      
      echo "Logging into target registry: $(targetRegistry)..."
      az acr login --name nonprodacr
      
      echo "Tagging image..."
      docker tag $(sourceRegistry)/$(imageRepository):$(imageTag) $(targetRegistry)/$(imageRepository):$(imageTag)
      
      echo "Pushing image to nonprodacr..."
      docker push $(targetRegistry)/$(imageRepository):$(imageTag)
